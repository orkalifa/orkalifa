</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">

<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FCE9D4; color: #2A1A12; font-family: Rubik, system-ui, sans-serif;">

    <defs>
      <radialGradient id="navSun">
        <stop offset="0" stop-color="#FFE9B8"></stop>
        <stop offset="0.5" stop-color="#F4B23E"></stop>
        <stop offset="1" stop-color="#F4B23E" stop-opacity="0"></stop>
      </radialGradient>
      <radialGradient id="destGlow">
        <stop offset="0" stop-color="#FFF2CF"></stop>
        <stop offset="0.45" stop-color="#F4B23E"></stop>
        <stop offset="1" stop-color="#E2622B" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
    <rect width="390" height="600" fill="#FCE9D4"></rect>
    <path d="M0 140 C80 120 160 170 240 150 C300 136 350 150 390 140 V330 C320 350 240 310 170 330 C110 346 50 320 0 330 Z" fill="#F8D7B6"></path>
    <path d="M0 360 C90 350 180 380 260 368 C320 360 360 372 390 368 V600 H0 Z" fill="#FBE2C6"></path>
    <path d="M40 400 L170 420 M30 440 L180 462 M24 480 L190 505" stroke="#F4CFA6" stroke-width="6" stroke-linecap="round"></path>
    <circle cx="0" cy="250" r="70" fill="url(#navSun)"></circle>
    <path d="M200 600 C204 520 250 470 236 410 C224 360 160 350 150 300" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"></path>
    <path d="M200 600 C204 520 250 470 236 410 C224 360 160 350 150 300" fill="none" stroke="#E2622B" stroke-width="8" stroke-linecap="round"></path>
    <path d="M150 300 C146 280 132 268 118 258" fill="none" stroke="#A8431A" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"></path>
    <circle class="dest" cx="112" cy="252" r="30" fill="url(#destGlow)"></circle>
    <circle cx="112" cy="252" r="9" fill="#5C3A28"></circle>
    <circle cx="202" cy="540" r="16" fill="#FFFFFF"></circle>
    <path d="M202 528 L211 550 L202 545 L193 550 Z" fill="#2A1A12"></path>
  </svg>

  <div style="position: absolute; top: 20px; right: 16px; left: 16px; display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: #2A1A12; color: #FFF4E6; border-radius: 22px; box-shadow: 0 10px 26px rgba(42,26,18,0.25);">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#F4B23E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20v-7a3 3 0 0 0-3-3H5"></path><path d="M9 6l-4 4 4 4"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 26px; font-weight: 700;">300 מ'</div>
      <div style="font-size: 15px; color: #F7DCC5;">פנו שמאלה לדרך העפר</div>
    </div>
  </div>

  <div style="position: absolute; top: 230px; right: 16px; padding: 6px 12px; border-radius: 999px; background: rgba(255,250,243,0.92); font-size: 12px; font-weight: 500; color: #4A2E20;">העץ הבודד · 3 דק' ברגל מהחניה</div>

  <div style="position: absolute; bottom: 0; right: 0; left: 0; height: 290px; box-sizing: border-box; padding: 16px 20px 24px; background: #FFFAF3; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 30px rgba(168,67,26,0.10); display: flex; flex-direction: column; gap: 16px;">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #EAD3BE;"></div>

    <div style="display: flex; align-items: center; gap: 18px;">
      <div style="position: relative; width: 104px; height: 104px; flex-shrink: 0;">
        <svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="ספירה לאחור עד השקיעה">
          <circle cx="52" cy="52" r="44" fill="none" stroke="#FBE2C6" stroke-width="9"></circle>
          <circle cx="52" cy="52" r="44" fill="none" stroke="#E2622B" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 52 52)"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;">
          <div style="font-size: 11px; color: #6B4A3A;">לשקיעה</div>
          <div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;">{{clock}}</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 14px; color: #6B4A3A;">הגעה משוערת</div>
        <div style="font-size: 30px; font-weight: 700;">17:12</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #A8431A;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          12 דק' לפני השקיעה
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; gap: 4px; height: 8px;">
        <div style="flex: 3 1 0; border-radius: 4px; background: #E2622B;"></div>
        <div style="flex: 1 1 0; border-radius: 4px; background: repeating-linear-gradient(90deg, #A8431A 0 6px, transparent 6px 10px);"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B4A3A;">
        <span>נסיעה · 9 דק'</span>
        <span>הליכה · 3 דק'</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <button style="flex-grow: 1; min-height: 50px; border-radius: 16px; border: 1px solid #EAD3BE; background: #FFFFFF; color: #2A1A12; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8431A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>
        דיווח בדרך
      </button>
      <a href="Main.dc.html" style="min-height: 50px; padding: 0 22px; border-radius: 16px; background: #2A1A12; color: #FFF4E6; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">סיום</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { secs: 24 * 60 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState({ secs: this.state.secs > 0 ? this.state.secs - 1 : 24 * 60 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const secs = this.state.secs;
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    const circ = 2 * Math.PI * 44;
    const filled = circ * Math.min(1, secs / (60 * 60));
    return {
      clock: m + ':' + (s < 10 ? '0' : '') + s,
      dash: filled.toFixed(1) + ' ' + circ.toFixed(1)
    };
  }
}
</script>
</body>
</html>
