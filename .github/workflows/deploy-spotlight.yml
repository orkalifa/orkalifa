# Builds the Spotlight web app and publishes it to GitHub Pages:
# https://orkalifa.github.io/orkalifa/
name: Deploy Spotlight

on:
  push:
    branches: [claude/claude-improvement-ideas-2rof6t]
    paths:
      - "apps/sunset-spots/**"
      - ".github/workflows/deploy-spotlight.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sunset-spots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sunset-spots/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export -p web
        env:
          CI: 1
          EXPO_OFFLINE: 1
      # Single-page app: serve index.html for unknown paths too.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/sunset-spots/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
