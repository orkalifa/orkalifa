# Builds the Spotlight web app and publishes it to GitHub Pages:
# https://orkalifa.github.io/orkalifa/
name: Deploy Spotlight

on:
  push:
    branches: [claude/claude-improvement-ideas-2rof6t]
    paths:
      - "apps/sunset-spots/**"
      - ".github/workflows/deploy-spotlight.yml"
  workflow_dispatch:

# Only the deploy job gets the Pages permissions (see below).
permissions:
  contents: read

# Never cancel a Pages deploy that is already running; the next run waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sunset-spots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sunset-spots/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo lint
        env:
          CI: 1
          EXPO_OFFLINE: 1
      # Export + icons, manifest, offline service worker, link previews (scripts/web-postbuild.mjs).
      - run: npm run build:web
        env:
          CI: 1
          EXPO_OFFLINE: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/sunset-spots/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Opens the live site in headless Chromium after every deploy and fails the run if it doesn't
  # load, throws script errors, or doesn't show the sunset and the spots (scripts/smoke-live.mjs).
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sunset-spots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (outside the app, nothing saved)
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Smoke check the live site
        run: node scripts/smoke-live.mjs
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: apps/sunset-spots/smoke-failure.png
          if-no-files-found: ignore
